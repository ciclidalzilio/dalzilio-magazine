name: probe-live
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pagina live Madone SL 7
        run: |
          mkdir -p probe
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" --compressed "https://ciclidalzilio.com/products/madone-sl-7-gen-9" -o /tmp/p.html
          python3 - <<'PY'
          import re, json
          h = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'<script type="application/json" data-dz-varianti>(.*?)</script>', h, re.S)
          out = {'trovato': bool(m)}
          if m:
              try:
                  v = json.loads(m.group(1)); out['n'] = len(v)
                  out['varianti'] = [{k: x.get(k) for k in ('titolo', 'colore_vero', 'taglia_vera', 'disponibile', 'foto')} for x in v]
              except Exception as e: out['err'] = str(e); out['raw'] = m.group(1)[:3000]
          json.dump(out, open('probe/live.json', 'w'), ensure_ascii=False, indent=1)
          PY
          wc -c probe/live.json
      - name: commit
        run: |
          git config user.name probe; git config user.email probe@local
          git add probe/; git commit -m "probe: pagina live madone" || true; git pull --rebase || true; git push
