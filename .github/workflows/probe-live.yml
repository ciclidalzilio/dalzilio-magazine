name: probe-live
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: thumbs live Madone
        run: |
          mkdir -p probe
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" --compressed "https://ciclidalzilio.com/products/madone-sl-7-gen-9" -o /tmp/p.html
          python3 -c "
          import re, json
          h = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          th = re.findall(r'data-dz-thumb=\"(\d+)\"\s+data-src=\"([^\"]+)\"\s+data-varianti=\"([^\"]*)\"', h)
          json.dump([(i, u.split('/')[-1][:40], v[:60]) for i, u, v in th], open('probe/thumbs.json', 'w'), indent=0)
          print(len(th))"
      - name: commit
        run: |
          git config user.name probe; git config user.email probe@local
          git add probe/; git commit -m "probe: thumbs" || true; git pull --rebase || true; git push
