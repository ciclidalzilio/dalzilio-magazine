name: probe-prem
on:
  push:
    branches: [claude/install-ui-ux-pro-max-cq88gs]
    paths: [".github/workflows/probe-prem.yml", "probe/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: test
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          timeout 300 node probe/shot.js "https://ciclidalzilio.com/products/madone-sl-7-gen-9?preview_theme_id=202314711304" || true
          rm -rf node_modules package.json package-lock.json
      - name: commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git checkout -- . || true
          git add -A
          git commit -m "probe prem: risultati" || exit 0
          git fetch origin claude/install-ui-ux-pro-max-cq88gs
          git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -m "probe prem: risultati")
          git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
