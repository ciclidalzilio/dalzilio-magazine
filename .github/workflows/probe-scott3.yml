name: probe-scott3
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EAN tungsten grey per taglia
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe
          : > probe/ean-grey.csv
          for a in 4256008350004 4256008350006 4256008350008 4256008350010 4256008350012; do
            curl -sSL -A "$UA" --compressed -H "Accept-Language: it-IT,it;q=0.9" "https://www.scott-sports.com/it/it/product/scott-fastlane-10-bike?article=$a" -o /tmp/a.html
            g=$(grep -oE 'gtin13"[^0-9]{0,6}[0-9]{13}' /tmp/a.html | grep -oE '[0-9]{13}' | head -1)
            s=$(grep -oE '"sku"[^0-9]{0,6}[0-9]{13}' /tmp/a.html | grep -oE '[0-9]{13}' | head -1)
            c=$(grep -oiE '"color"[^"]{0,6}"[^"]{2,40}"' /tmp/a.html | head -1)
            echo "$a;$g;$s;$c" | tee -a probe/ean-grey.csv
          done
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: EAN tungsten grey" || echo "niente"
          git push
