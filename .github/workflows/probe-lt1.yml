name: probe-lt1
on:
  push:
    branches: [claude/install-ui-ux-pro-max-cq88gs]
    paths: [".github/workflows/probe-lt1.yml", "probe/**"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: pagina e foto
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe/img
          curl -sL -A "$UA" -H "Accept-Language: it-IT" -o /tmp/lt1.html "https://www.cannondale.com/it-it/bikes/electric/e-mountain/moterra-neo-lt/moterra-lt-1"
          echo "html $(wc -c < /tmp/lt1.html)" > probe/log.txt
          python3 probe/estrai.py /tmp/lt1.html probe/lt1.json >> probe/log.txt
          python3 - <<'PY' > probe/urls.txt
          import json
          d=json.load(open('probe/lt1.json'))
          print('nomi', d.get('nomi_c65134u'), 'dorelrl', d.get('dorelrl_count'), file=open('probe/log.txt','a'))
          for im in d['images']:
              n=im['file'].rsplit('.',1)[0]
              print(f"https://embed.widencdn.net/img/dorelrl/{im['id']}/2400px@1x/{n}.jpg?color=f8f8f8&q=90 {n}")
          PY
          while read -r u n; do
            [ -z "$u" ] && continue
            [ -f "probe/img/$n.jpg" ] && continue
            code=$(curl -sL -A "$UA" -o "probe/img/$n.jpg" -w "%{http_code}" "$u"); echo "$code $n $(wc -c < probe/img/$n.jpg)" >> probe/log.txt
          done < probe/urls.txt
          find probe/img -type f -size -15k -delete
          for f in probe/img/*.jpg; do [ -f "$f" ] && ! file "$f" | grep -q JPEG && rm -f "$f"; done
          ls -la probe/img >> probe/log.txt; cat probe/log.txt
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A probe; git commit -qm "probe lt1: risultati" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe lt1: risultati"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
