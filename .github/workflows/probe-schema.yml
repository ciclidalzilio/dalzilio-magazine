name: probe-schema
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scarica pagine in anteprima tema 31
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe
          T=201529295112
          curl -sSL -A "$UA" --compressed -c c.txt -b c.txt "https://www.ciclidalzilio.com/?preview_theme_id=$T" -o probe/home.html
          curl -sSL -A "$UA" --compressed -c c.txt -b c.txt "https://www.ciclidalzilio.com/collections/usato-1?preview_theme_id=$T" -o probe/collezione.html
          curl -sSL -A "$UA" --compressed -c c.txt -b c.txt "https://www.ciclidalzilio.com/collections/usato-1/products/cannondale-topstone-tg-m?preview_theme_id=$T" -o probe/prodotto.html
          curl -sSL -A "$UA" --compressed -c c.txt -b c.txt "https://www.ciclidalzilio.com/products/cannondale-moterra-1?preview_theme_id=$T" -o probe/prodotto2.html
          wc -c probe/*.html
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: pagine anteprima tema 31" || echo "niente"
          git push
