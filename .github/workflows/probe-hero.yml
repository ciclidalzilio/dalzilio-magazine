name: probe-hero
on: push
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scarica hero-corsa dal tema live
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe
          curl -sSL -A "$UA" --compressed "https://www.ciclidalzilio.com/" -o probe/home.html
          echo "byte home: $(wc -c < probe/home.html)"
          URL=$(grep -oE '(https?:)?//[^"'"'"' )]*hero-corsa\.jpg[^"'"'"' )]*' probe/home.html | head -1)
          case "$URL" in //*) URL="https:$URL";; esac
          echo "URL trovato: $URL"
          if [ -n "$URL" ]; then curl -sSL -A "$UA" "$URL" -o probe/hero-corsa.jpg; fi
          ls -la probe/
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: hero-corsa dal tema live" || echo "niente da committare"
          git push
