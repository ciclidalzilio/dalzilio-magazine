name: debug-fetch
on:
  push:
    branches: ["claude/**"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica due foto reali in base64
        run: |
          UA="Mozilla/5.0 (Macintosh) Chrome/126.0"
          curl -sL -A "$UA" -o cann.jpg "https://ciclidalzilio.com/cdn/shop/files/3_b63d29f7-188b-4c64-aa31-30ce4a14c173.jpg?v=1771578578&width=180"
          curl -sL -A "$UA" -o scott.png "https://ciclidalzilio.com/cdn/shop/files/4233028086.png?v=1780097736&width=180"
          file cann.jpg scott.png; wc -c cann.jpg scott.png
          echo "=== B64 CANN INIZIO ==="; base64 -w0 cann.jpg; echo; echo "=== B64 CANN FINE ==="
          echo "=== B64 SCOTT INIZIO ==="; base64 -w0 scott.png; echo; echo "=== B64 SCOTT FINE ==="
