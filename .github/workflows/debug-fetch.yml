name: debug-fetch
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/debug-fetch.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica foto Speedster e committala
        run: |
          UA="Mozilla/5.0 (Macintosh) Chrome/126.0"
          mkdir -p diagnostica
          curl -sL -A "$UA" -o diagnostica/speedster.png "https://ciclidalzilio.com/cdn/shop/files/293264.png?v=1763512516&width=180"
          file diagnostica/speedster.png
          git config user.name "debug-bot"
          git config user.email "debug@local"
          git add diagnostica && git commit -m "diagnostica: foto speedster" && git push
