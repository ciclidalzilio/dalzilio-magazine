name: probe-trek
on: push
permissions:
  contents: write
jobs:
  cannondale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: playwright Topstone
        shell: bash
        run: |
          set +e
          mkdir -p probe/img
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > pw.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          const URL0 = 'https://www.cannondale.com/it-it/bikes/road/gravel/topstone-carbon/topstone-carbon-3-grx-1x-c15355u';
          const clean = s => (s || '').replace(/(pk|sk)\.[A-Za-z0-9._-]{20,}/g, '[tok]');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: 'it-IT', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36', viewport: { width: 1400, height: 1000 } });
            const p = await ctx.newPage(); const o = { url: URL0, swatches: [], error: null, allImgs: [] };
            const seenNet = new Set();
            p.on('response', r => { const u = r.url(); if (/widen|cannondale.*(jpg|png|webp)|\.(jpg|jpeg|png|webp)(\?|$)/i.test(u)) seenNet.add(u.split('?')[0]); });
            try {
              await p.goto(URL0, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await p.waitForTimeout(9000);
              for (const t of ['Accetta tutti', 'Accetta', 'Accept All', 'Accept all', 'Accetto', 'OK']) { const el = p.getByRole('button', { name: t }).first(); if (await el.count()) { await el.click().catch(()=>{}); break; } }
              await p.waitForTimeout(1500);
              o.finalUrl = p.url(); o.title = await p.title();
              const html = await p.content();
              o.ld = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].map(m => m[1].slice(0, 8000));
              o.metaDesc = (html.match(/<meta name="description" content="([^"]*)"/) || [])[1] || '';
              fs.writeFileSync('probe/body.txt', clean(await p.locator('body').innerText()));
              const grab = async (tag) => {
                await p.waitForTimeout(2500);
                const info = await p.evaluate(() => {
                  const imgs = [...document.querySelectorAll('img, source')].map(e => e.currentSrc || e.src || e.srcset || e.getAttribute('data-src') || '').filter(Boolean);
                  const sel = [...document.querySelectorAll('[aria-checked="true"],[aria-selected="true"],.selected,.active,input:checked')].map(e => (e.getAttribute('aria-label') || e.getAttribute('title') || e.textContent || '').trim()).filter(Boolean).slice(0, 12);
                  const colTxt = [...document.querySelectorAll('body *')].filter(e => e.children.length === 0 && /(colore|color)/i.test(e.textContent || '')).map(e => (e.parentElement ? e.parentElement.innerText : e.innerText).replace(/\s+/g, ' ').trim().slice(0, 140)).slice(0, 10);
                  return { imgs: [...new Set(imgs)].slice(0, 80), sel, colTxt, url: location.href };
                });
                o.swatches.push({ tag, ...info });
              };
              await grab('initial');
              // swatch colore: prova vari selettori
              const sels = ['[class*="swatch"] button', '[class*="swatch"] a', '[class*="swatch"] label', '[class*="color"] button', '[class*="colour"] button', 'button[aria-label*="olor"]', '[data-testid*="color"] button', '[class*="Color"] li', '[class*="color"] li a', 'input[name*="olor"]'];
              let found = 0;
              for (const s of sels) {
                const loc = p.locator(s); const n = await loc.count();
                if (!n || n > 12) continue;
                found = n; o.swatchSelector = s;
                for (let k = 0; k < n; k++) {
                  const el = loc.nth(k);
                  const tag = (await el.getAttribute('aria-label')) || (await el.getAttribute('title')) || (await el.innerText().catch(()=>'')) || ('n' + k);
                  try { await el.scrollIntoViewIfNeeded(); await el.click({ timeout: 4000, force: true }); } catch (e) { continue; }
                  await grab(tag.trim().slice(0, 60));
                }
                break;
              }
              o.nSwatch = found;
              o.netImgs = [...seenNet];
            } catch (e) { o.error = String(e); }
            // scarica immagini grandi (widen / cannondale media)
            const all = new Set(); for (const s of o.swatches) for (const u of s.imgs) all.add(u); for (const u of (o.netImgs || [])) all.add(u);
            let n = 0;
            for (let u of all) {
              if (!/^https?:/.test(u)) continue;
              if (!/widen|cannondale/i.test(u)) continue;
              if (/logo|icon|flag|svg|sprite|badge/i.test(u)) continue;
              let big = u.replace(/(\?|&)(w|width)=\d+/g, '').replace(/\/(\d+)px(\/|$)/, '/2000px$2');
              try { const r = await ctx.request.get(big, { timeout: 30000 }); if (!r.ok()) continue; const buf = await r.body(); if (buf.length < 20000) continue; const name = ('img' + String(n++).padStart(2, '0') + '-' + big.split('/').pop().split('?')[0].replace(/[^A-Za-z0-9._-]/g, '_')).slice(0, 90); fs.writeFileSync('probe/img/' + name + (/(\.jpe?g|\.png|\.webp)$/i.test(name) ? '' : '.jpg'), buf); o.allImgs.push({ big, name, size: buf.length }); } catch (e) {}
              if (n >= 60) break;
            }
            fs.writeFileSync('probe/pw.json', JSON.stringify(o, null, 1));
            await b.close();
          })();
          JS
          node pw.js; echo "pw.json: $(wc -c < probe/pw.json)"; ls probe/img | wc -l
          rm -rf node_modules package.json package-lock.json pw.js; git checkout -- . 2>/dev/null
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: Cannondale Topstone" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: Cannondale Topstone"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
