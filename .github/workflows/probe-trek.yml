name: probe-trek
on: push
permissions:
  contents: write
jobs:
  ors:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Orange Slice e C4
        shell: bash
        run: |
          set +e
          mkdir -p probe/img2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          while read -r u; do
            [ -z "$u" ] && continue
            n=$(basename "$u"); n="${n%.*}"; big=$(echo "$u" | sed -E 's|/[0-9]+px@1x/|/2400px@1x/|; s|\.(png\|jpg\|webp)$||')
            [ -f "probe/img2/$n.jpg" ] && continue
            code=$(curl -sL -A "$UA" -o "probe/img2/$n.jpg" -w "%{http_code}" "$big.jpg?color=f8f8f8&q=90"); echo "$code $n $(wc -c < probe/img2/$n.jpg)"
          done < probe/urls2.txt
          find probe/img2 -type f -size -15k -delete; ls -la probe/img2
          # C4: varianti dal JSON della pagina (pattern SMU)
          curl -sL -A "$UA" -H "Accept-Language: it-IT" -o /tmp/c4.html "https://www.cannondale.com/it-it/bikes/road/gravel/topstone-carbon/topstone-carbon-4-cues-1x-smu"
          { grep -o '"Sku":"[A-Z0-9]*"[^}]\{0,300\}' /tmp/c4.html | grep -o '"Sku":"[^"]*"\|"ColorName":"[^"]*"\|"Size":"[^"]*"\|"Upc":"[0-9]*"' | paste - - - - | sort -u | grep -i "C1524\|PLT\|Platinum"; grep -o '"gtin1[23]": *"[0-9]*"' /tmp/c4.html | sort -u; grep -o 'C1524GU[A-Z0-9]*' /tmp/c4.html | sort -u | head; } > probe/c4.txt; cat probe/c4.txt
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: ORS e C4" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: ORS e C4"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
