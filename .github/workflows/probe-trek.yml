name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: foto SL 6 e SL 5 nuovi colori
        shell: bash
        run: |
          set +e
          mkdir -p probe/img2
          for m in "MadoneSL6-27-57662" "MadoneSL5-27-57653"; do
            for L in C D E; do
              for v in Primary Alt1 Alt2 Alt3 Alt4 Alt5; do
                n="$m-$L-$v"
                curl -sfL --max-time 60 -A "Mozilla/5.0" -o "probe/img2/$n.jpg" "https://media.trekbikes.com/image/upload/w_1800/$n" && echo "ok $n $(wc -c < probe/img2/$n.jpg)" || echo "no $n"
              done
            done
          done
          find probe/img2 -type f -size -15k -delete
          ls -la probe/img2
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add probe/; git commit -m "probe: foto SL6 SL5" || echo "niente"; git pull --rebase || true; git push
