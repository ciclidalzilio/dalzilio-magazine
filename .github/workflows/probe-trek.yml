name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: dati Madone SL 7 Lunar Silver da rivenditori
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe
          n=0
          for u in "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-xs" "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-s" "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-m" "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-ml" "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-l" "https://ciclimattio.com/en/p/trek/madone-sl-7-gen-8--matte-lunar-silver-xl" "https://www.trekstore.co.uk/shop/bikes/road/trek-2026-madone-sl-7-gen-8-18825/option/" "https://www.freebike.bike/en/product/street-en/trek-en/trek-madone-sl-7-gen-8-matte-lavender-haze-deep-smoke/"; do
            n=$((n+1)); timeout 60 curl -sSL -A "$UA" --compressed "$u" -o /tmp/p$n.html; echo "$n $u -> $(wc -c < /tmp/p$n.html) byte"
          done
          python3 - <<'PY'
          import re, glob
          out = []
          for f in sorted(glob.glob('/tmp/p*.html')):
              h = open(f, encoding='utf-8', errors='replace').read().replace('\\/', '/')
              t = re.search(r'<title>(.*?)</title>', h, re.S); out.append('=== %s | %s' % (f, (t.group(1).strip()[:120] if t else '')))
              for m in re.finditer(r'(?:sku|SKU|Sku|codice|Codice|articolo|Part|part|mpn|MPN)[^0-9]{0,40}(53\d{5})', h):
                  out.append('SKU ' + m.group(1) + ' | ' + re.sub(r'\s+', ' ', h[max(0, m.start()-80):m.end()+80]))
              for m in re.finditer(r'(?:ean|EAN|gtin|GTIN|barcode|upc|UPC)[^0-9]{0,30}(\d{12,13})', h):
                  out.append('EAN ' + m.group(1) + ' | ' + re.sub(r'\s+', ' ', h[max(0, m.start()-80):m.end()+40]))
              for b in re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S):
                  if 'Product' in b: out.append('LDJSON ' + re.sub(r'\s+', ' ', b)[:6000])
              for c in sorted(set(re.findall(r'(?:Matte|Gloss|Satin) [A-Z][A-Za-z ]{2,40}(?:/[A-Za-z ]{2,40})?', h))):
                  out.append('COLORE ' + c)
              for i in sorted(set(re.findall(r'https?://[^"\' <>)]+(?:lunar|Lunar|LUNAR)[^"\' <>)]*\.(?:jpg|jpeg|png|webp)[^"\' <>)]*', h))):
                  out.append('IMG ' + i)
              for i in sorted(set(re.findall(r'https?://media\.trekbikes\.com/image/upload/[^"\' <>)]+', h)))[:60]:
                  out.append('TREKIMG ' + i)
          txt = '\n'.join(l for l in dict.fromkeys(out) if 'token' not in l.lower() and 'pk.ey' not in l)
          open('probe/lunar.txt', 'w').write(txt); print(len(txt))
          PY
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: Madone SL 7 lunar silver" || echo "niente"
          git pull --rebase || true
          git push
