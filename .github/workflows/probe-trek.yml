name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: playwright swatch per testo
        shell: bash
        run: |
          set +e
          mkdir -p probe/img
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > pw.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: 'it-IT', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36', viewport: { width: 1400, height: 1000 } });
            const p = await ctx.newPage(); const out = { swatches: [], html: [] };
            try {
              await p.goto('https://www.trekbikes.com/it/it_IT/biciclette/biciclette-da-corsa/bici-da-strada-ad-alte-prestazioni/madone/f/F213/madone-sl-7-gen-8/57664/', { waitUntil: 'domcontentloaded', timeout: 90000 });
              for (const t of ['Accetta tutti', 'Accetta', 'Accept All', 'Accept']) { const el = p.getByRole('button', { name: t }).first(); if (await el.count()) { await el.click().catch(()=>{}); break; } }
              await p.waitForTimeout(9000);
              // struttura dello swatch
              const probe = p.getByText('blue-black', { exact: true }).first();
              if (await probe.count()) { out.html.push(await probe.evaluate(e => (e.parentElement && e.parentElement.parentElement ? e.parentElement.parentElement.outerHTML : e.outerHTML).slice(0, 3000))); }
              const names = ['black', 'blue-black', 'purplelight-black', 'red-black', 'white', 'white-black', 'white-blue', 'white-red', 'white-grey', 'white-silver'];
              for (const nm of names) {
                const loc = p.getByText(nm, { exact: true }); const c = await loc.count(); if (!c) continue;
                for (let k = 0; k < Math.min(c, 3); k++) {
                  const el = loc.nth(k);
                  const clk = el.locator('xpath=ancestor-or-self::*[self::button or self::label or self::a or @role="radio" or @role="button" or @role="option"][1]');
                  const target = (await clk.count()) ? clk.first() : el;
                  try { await target.scrollIntoViewIfNeeded(); await target.click({ timeout: 4000, force: true }); await p.waitForTimeout(2500); } catch (e) { out.swatches.push({ nm, k, err: String(e).slice(0, 120) }); continue; }
                  const body = await p.locator('body').innerText();
                  const cols = [...body.matchAll(/Colore\s*\/\s*\n?\s*([^\n]{3,80})/g)].map(m => m[1].trim());
                  const imgs = [...new Set(await p.locator('img').evaluateAll(els => els.map(e => e.currentSrc || e.src).filter(s => s && s.includes('57664'))))];
                  out.swatches.push({ nm, k, url: p.url(), cols, imgs: imgs.slice(0, 12) });
                  for (const u of imgs.slice(0, 12)) {
                    const name = u.split('/').pop().split('?')[0]; if (!/Primary|Alt|Portrait|Detail/i.test(name)) continue;
                    const fn = 'probe/img/' + name + '.jpg'; if (fs.existsSync(fn)) continue;
                    try { const r = await ctx.request.get('https://media.trekbikes.com/image/upload/w_1800/' + name); if (r.ok()) fs.writeFileSync(fn, await r.body()); } catch (e) {}
                  }
                }
              }
            } catch (e) { out.error = String(e); }
            fs.writeFileSync('probe/pw4.json', JSON.stringify(out, null, 1));
            await b.close();
          })();
          JS
          node pw.js; echo "pw4.json: $(wc -c < probe/pw4.json)"; ls probe/img
          rm -rf node_modules package.json package-lock.json pw.js
          find probe/img -type f -size -15k -delete
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add probe/; git commit -m "probe: swatch per testo" || echo "niente"; git pull --rebase || true; git push
