name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: foto Domane altri colori
        shell: bash
        run: |
          set +e
          rm -rf probe/img probe/*.txt probe/pw.json; mkdir -p probe/img2
          for m in "DomaneSL5-27-77555" "DomaneSL6AXS-27-79844" "DomaneSL7AXS1x13-27-79818"; do
            for L in B C D E F; do
              for v in Primary Alt1 Alt2 Alt3 Alt4 Alt5; do
                n="$m-$L-$v"
                curl -sfL --max-time 60 -A "Mozilla/5.0" -o "probe/img2/$n.jpg" "https://media.trekbikes.com/image/upload/w_1800/$n" && echo "ok $n" || echo "no $n"
              done
            done
          done
          find probe/img2 -type f -size -15k -delete
          ls probe/img2 | wc -l
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A probe/; git commit -m "probe: foto Domane B-F" || echo "niente"; git pull --rebase || true; git push
