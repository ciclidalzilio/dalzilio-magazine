name: probe-trek
on: push
permissions:
  contents: write
jobs:
  sito:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: controllo vetrina
        shell: bash
        run: |
          set +e
          mkdir -p probe
          {
            for u in "https://ciclidalzilio.com/products/domane-sl-5-gen-6" "https://ciclidalzilio.com/products/domane-sl-6-axs-gen-5" "https://ciclidalzilio.com/collections/bici-da-strada" "https://ciclidalzilio.com/collections/bici-da-strada?page=2" "https://ciclidalzilio.com/search?q=domane" "https://ciclidalzilio.com/collections/new-arrivals"; do
              echo "== $u"
              curl -sL -A "Mozilla/5.0" -o /tmp/p.html -w "http %{http_code} finale %{url_effective}\n" "$u"
              echo "titolo: $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"
              echo "occorrenze Domane SL 5: $(grep -o 'Domane SL 5 Gen 5' /tmp/p.html | wc -l) | SL 6 AXS: $(grep -o 'Domane SL 6 AXS Gen 5' /tmp/p.html | wc -l) | SL 7 AXS: $(grep -o 'Domane SL 7 AXS 1x Gen 5' /tmp/p.html | wc -l)"
              echo "link sl5: $(grep -o 'href="[^"]*domane-sl-5[^"]*"' /tmp/p.html | sort -u | head -3)"
              echo "card titles: $(grep -o 'class="prod[^>]*>' /tmp/p.html | wc -l) card; primi titoli: $(grep -o 'alt="[^"]*"' /tmp/p.html | head -12 | tr '\n' ' ')"
            done
          } > probe/sito.txt 2>&1
          cat probe/sito.txt
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: vetrina Domane" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: vetrina Domane"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
