name: probe-trek
on: push
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: screenshot mobile tema 37
        shell: bash
        run: |
          set +e
          mkdir -p probe
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > pw.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...devices['iPhone 13'], locale: 'it-IT' });
            const p = await ctx.newPage();
            const base = 'https://ciclidalzilio.com/collections/gravel?preview_theme_id=201632383240&filter.p.vendor=CANNONDALE';
            await p.goto(base, { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(()=>{});
            await p.waitForTimeout(6000);
            const t = await p.title(); console.log('title', t, p.url());
            const grid = p.locator('.listgrid').first();
            if (await grid.count()) { await grid.scrollIntoViewIfNeeded(); await p.waitForTimeout(2500); await grid.screenshot({ path: 'probe/mobile-grid.png' }); }
            else await p.screenshot({ path: 'probe/mobile-grid.png', fullPage: false });
            // stessa cosa col tema live per confronto
            const p2 = await ctx.newPage();
            await p2.goto('https://ciclidalzilio.com/collections/gravel?filter.p.vendor=CANNONDALE', { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(()=>{});
            await p2.waitForTimeout(6000);
            const g2 = p2.locator('.listgrid').first();
            if (await g2.count()) { await g2.scrollIntoViewIfNeeded(); await p2.waitForTimeout(2500); await g2.screenshot({ path: 'probe/mobile-grid-live.png' }); }
            const nz = await p.locator('.prod .pimg img').evaluateAll(els => els.slice(0, 8).map(e => (e.alt || '').slice(0, 40) + ' nz=' + e.style.getPropertyValue('--nz')));
            console.log(JSON.stringify(nz));
            require('fs').writeFileSync('probe/nz.txt', JSON.stringify(nz, null, 1));
            await b.close();
          })();
          JS
          node pw.js
          rm -rf node_modules package.json package-lock.json pw.js; git checkout -- . 2>/dev/null
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: screenshot mobile" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: screenshot mobile"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
