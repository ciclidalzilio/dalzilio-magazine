name: probe-trek
on: push
permissions:
  contents: write
jobs:
  upc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: varianti Topstone
        shell: bash
        run: |
          set +e
          mkdir -p probe
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -H "Accept-Language: it-IT" -o /tmp/p.html "https://www.cannondale.com/it-it/bikes/road/gravel/topstone-carbon/topstone-carbon-3-grx-1x-c15355u"
          echo "bytes $(wc -c < /tmp/p.html)" > probe/upc.txt
          grep -o '"Sku":"C15355U[0-9]*","ColorName":"[^"]*","ColorSwatch":"[A-Z]*","ColorFilter":\[[^]]*\],"Size":"[0-9]*","Upc":"[0-9]*"' /tmp/p.html | sort -u >> probe/upc.txt
          grep -o '"sku": "C15355U[0-9]*", "gtin12": "[0-9]*"' /tmp/p.html | sort -u >> probe/upc.txt
          grep -o 'MainDetailImage":"[^"]*"' /tmp/p.html | sort -u | head -20 >> probe/upc.txt
          cat probe/upc.txt
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: upc Topstone" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: upc Topstone"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
