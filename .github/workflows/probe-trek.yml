name: probe-trek
on: push
permissions:
  contents: write
jobs:
  anteprima:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: anteprima tema 36
        shell: bash
        run: |
          set +e
          mkdir -p probe
          {
            for u in "https://ciclidalzilio.com/collections/bici-da-strada?preview_theme_id=201625075976" "https://ciclidalzilio.com/collections/bici-da-strada?preview_theme_id=201625075976&filter.p.vendor=TREK"; do
              echo "== $u"
              curl -sL -A "Mozilla/5.0" -c /tmp/c.txt -b /tmp/c.txt -o /tmp/p.html -w "http %{http_code}\n" "$u"
              echo "tema nell'html: $(grep -o 'dztema2026-3[0-9][^"<]*' /tmp/p.html | head -1) | theme_id: $(grep -o 'Shopify.theme[^;]*' /tmp/p.html | head -1 | cut -c1-160)"
              echo "card: $(grep -o '<article class="prod[^"]*"' /tmp/p.html | wc -l) | con due colori: $(grep -o 'due-colori' /tmp/p.html | wc -l) | img hover: $(grep -o 'img class="hover"' /tmp/p.html | wc -l)"
              echo "esempi hover:"; grep -o '<article class="prod[^"]*"[^>]*>' /tmp/p.html | head -12
              grep -o 'img class="hover" src="[^"]*" alt="[^"]*"' /tmp/p.html | head -12 | sed 's|src="[^"]*"||'
              echo "css hover: $(grep -o 'img\.hover{opacity:0' /tmp/p.html | wc -l)"
              css=$(grep -o 'https://[^"]*dz-tema\.css[^"]*' /tmp/p.html | head -1); echo "css url: $css"; [ -n "$css" ] && curl -sL "$css" | grep -o 'img\.hover[^}]*}' | head -3
            done
          } > probe/anteprima.txt 2>&1
          cat probe/anteprima.txt
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: anteprima tema 36" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: anteprima tema 36"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
