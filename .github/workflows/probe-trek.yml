name: probe-trek
on: push
permissions:
  contents: write
jobs:
  cannondale2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: colori Topstone
        shell: bash
        run: |
          set +e
          mkdir -p probe/img2
          npm init -y >/dev/null 2>&1; npm i playwright@1.47.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > pw.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          const URL0 = 'https://www.cannondale.com/it-it/bikes/road/gravel/topstone-carbon/topstone-carbon-3-grx-1x-c15355u';
          const clean = s => (s || '').replace(/(pk|sk)\.[A-Za-z0-9._-]{20,}/g, '[tok]');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext({ locale: 'it-IT', userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36', viewport: { width: 1400, height: 1000 } });
            const p = await ctx.newPage(); const o = { radios: [], clicks: [], found: {}, search: [], error: null };
            try {
              await p.goto(URL0, { waitUntil: 'domcontentloaded', timeout: 90000 }); await p.waitForTimeout(8000);
              for (const t of ['Accetta tutti', 'Accetta', 'Accept All', 'Accept all']) { const el = p.getByRole('button', { name: t }).first(); if (await el.count()) { await el.click().catch(()=>{}); break; } }
              await p.waitForTimeout(1000);
              const html = await p.content();
              for (const key of ['Moonrock', 'MNR', 'moonrock', 'C24_C15355U', 'C15355U_Topstone_Crb_3_GRX_1x_']) {
                const hits = []; let i = -1; while ((i = html.indexOf(key, i + 1)) !== -1 && hits.length < 12) hits.push(clean(html.slice(Math.max(0, i - 150), i + 200)).replace(/\s+/g, ' '));
                o.found[key] = hits;
              }
              o.widen = [...new Set([...html.matchAll(/https:\/\/embed\.widencdn\.net\/img\/dorelrl\/[a-z0-9]+\/[^"'\s\\]+/g)].map(m => m[0].split('?')[0]))].filter(u => /C15355U/.test(u));
              o.radios = await p.evaluate(() => [...document.querySelectorAll('[role="radio"], input[type="radio"], [aria-label*="radio"]')].map(e => ({ tag: e.tagName, label: e.getAttribute('aria-label') || e.getAttribute('title') || e.value || '', cls: (e.className || '').toString().slice(0, 80), checked: e.getAttribute('aria-checked') || e.checked })));
              // clicca ogni radio dentro l'area colore del prodotto
              const rad = p.locator('[role="radio"], input[type="radio"]'); const n = await rad.count();
              for (let k = 0; k < Math.min(n, 10); k++) {
                const el = rad.nth(k); const lab = (await el.getAttribute('aria-label')) || '';
                try { await el.scrollIntoViewIfNeeded(); await el.click({ timeout: 3000, force: true }); await p.waitForTimeout(2500); } catch (e) { o.clicks.push({ lab, err: String(e).slice(0, 80) }); continue; }
                const info = await p.evaluate(() => ({ url: location.href, col: ([...document.querySelectorAll('body *')].find(e => e.children.length === 0 && /^COLORE/i.test((e.textContent || '').trim())) || {}).textContent, imgs: [...new Set([...document.querySelectorAll('img')].map(e => e.currentSrc || e.src).filter(s => /widencdn/.test(s)).map(s => s.split('?')[0]))].slice(0, 20) }));
                o.clicks.push({ lab, ...info });
              }
              // ricerca sito
              await p.goto('https://www.cannondale.com/it-it/search?q=topstone%20carbon%203', { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(()=>{}); await p.waitForTimeout(6000);
              o.search = await p.evaluate(() => [...new Set([...document.querySelectorAll('a[href*="topstone-carbon-3"]')].map(a => a.href))]);
              o.searchText = clean(await p.locator('body').innerText()).slice(0, 3000);
            } catch (e) { o.error = String(e); }
            // scarica tutte le widen trovate (grandi) che non siano DTE
            let n = 0;
            const all = new Set(o.widen || []); for (const c of o.clicks) for (const u of (c.imgs || [])) all.add(u);
            for (const u of all) {
              if (/_DTE_/.test(u)) continue;
              const big = u.replace(/\/\d+px@1x\//, '/2400px@1x/').replace(/\.(webp|png)$/, '.jpg');
              try { const r = await ctx.request.get(big + '?color=f8f8f8&q=90', { timeout: 30000 }); if (!r.ok()) continue; const buf = await r.body(); if (buf.length < 20000) continue; const name = big.split('/').pop().replace(/[^A-Za-z0-9._-]/g, '_'); fs.writeFileSync('probe/img2/' + name, buf); n++; } catch (e) {}
              if (n >= 30) break;
            }
            fs.writeFileSync('probe/colori.json', JSON.stringify(o, null, 1));
            await b.close();
          })();
          JS
          node pw.js; ls probe/img2 | wc -l
          rm -rf node_modules package.json package-lock.json pw.js; git checkout -- . 2>/dev/null
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: colori Topstone" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: colori Topstone"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
