name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: render varianti nuove con Chrome
        shell: bash
        run: |
          set +e
          mkdir -p probe
          n=0
          for U in "https://www.trekbikes.com/it/it_IT/p/5346748/" "https://www.trekbikes.com/it/it_IT/p/5346742/" "https://www.trekbikes.com/it/it_IT/biciclette/biciclette-da-corsa/bici-da-strada-ad-alte-prestazioni/madone/madone-sl/madone-sl-7-gen-8/p/57664/"; do
            n=$((n+1))
            timeout 150 google-chrome --headless=new --disable-gpu --no-sandbox --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" --lang=it-IT --virtual-time-budget=25000 --dump-dom "$U" > /tmp/v$n.html 2>/dev/null
            echo "$n $U -> $(wc -c < /tmp/v$n.html)"
          done
          python3 - <<'PY'
          import re, glob
          out = []
          for f in sorted(glob.glob('/tmp/v*.html')):
              h = open(f, encoding='utf-8', errors='replace').read().replace('\\/', '/').replace('\\"', '"').replace('&quot;', '"')
              t = re.search(r'<title>(.*?)</title>', h, re.S); out.append('=== %s | %s' % (f, (t.group(1).strip() if t else '')))
              for m in re.finditer(r'"(?:colorName|colourName|colorDisplayName|swatchName|colour|color)"\s*:\s*"([^"]{3,60})"', h):
                  out.append('COLORNAME ' + m.group(1))
              for m in re.finditer(r'(?:aria-label|alt|title|data-color(?:-name)?)="([^"]*(?:Matte|Gloss|Satin)[^"]{3,70})"', h):
                  out.append('SWATCH ' + m.group(1))
              for m in re.finditer(r'5346(?:74[2-9]|75[0-3])', h):
                  ctx = h[max(0, m.start()-400): m.end()+400]
                  names = re.findall(r'"([A-Za-z]+(?:Name|Code|name|code|price|Price|ean|upc|gtin\w*))"\s*:\s*"?([^",}]{1,80})', ctx)
                  out.append('CTX %s | %s' % (m.group(0), ' | '.join(dict.fromkeys('%s=%s' % (k, v.strip()) for k, v in names))[:500]))
              for i in sorted(set(re.findall(r'https?://media\.trekbikes\.com/image/upload/[^"\' <>)]+', h))):
                  out.append('IMG ' + i)
              for m in re.finditer(r'(?:€|EUR)\s?([0-9.]{4,7})', h):
                  out.append('PREZZO ' + m.group(1))
          txt = '\n'.join(l for l in dict.fromkeys(out) if 'token' not in l.lower())
          open('probe/varianti.txt', 'w').write(txt); print('righe', txt.count('\n'))
          PY
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: varianti nuove Madone SL 7" || echo "niente"
          git pull --rebase || true
          git push
