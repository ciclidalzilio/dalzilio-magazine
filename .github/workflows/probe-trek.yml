name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: tenta URL immagini Trek per SKU nuovi
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe/img
          for sku in 5346748 5346742; do
            for pre in MadoneSL7Gen8-26 MadoneSL7Gen8-25 MadoneSL7Gen8-27 MadoneSL7-27 MadoneSL7-26 MadoneSL7Gen8; do
              for suf in A-Primary C-Primary B-Portrait A-Portrait; do
                u="https://media.trekbikes.com/image/upload/w_1600/${pre}-${sku}-${suf}"
                code=$(curl -sSL -A "$UA" -o /tmp/i.bin -w '%{http_code}' "$u")
                sz=$(wc -c < /tmp/i.bin)
                if [ "$code" = "200" ] && [ "$sz" -gt 20000 ]; then cp /tmp/i.bin "probe/img/${pre}-${sku}-${suf}.jpg"; echo "OK $u ($sz)"; fi
              done
            done
          done
          ls -la probe/img
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: immagini Trek per SKU" || echo "niente"
          git pull --rebase || true
          git push
