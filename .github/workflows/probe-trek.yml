name: probe-trek
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: dealer USA + Trek US
        shell: bash
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p probe/img
          n=0
          for U in "https://www.helenscycles.com/product/trek-madone-sl-7-gen-8-1246986-1.htm" "https://www.freewheelbike.com/product/trek-madone-sl-7-gen-8-770514-1.htm" "https://www.trekofclt.com/product/trek-madone-sl-7-gen-8-1246986-1.htm"; do
            n=$((n+1)); timeout 60 curl -sSL -A "$UA" --compressed "$U" -o /tmp/d$n.html; echo "$n -> $(wc -c < /tmp/d$n.html)"
          done
          timeout 150 google-chrome --headless=new --disable-gpu --no-sandbox --user-agent="$UA" --virtual-time-budget=25000 --dump-dom "https://www.trekbikes.com/us/en_US/bikes/road-bikes/performance-road-bikes/madone/madone-sl/madone-sl-7-gen-8/p/46220/" > /tmp/d9.html 2>/dev/null; echo "trek us -> $(wc -c < /tmp/d9.html)"
          python3 - <<'PY'
          import re, glob
          out = []
          for f in sorted(glob.glob('/tmp/d*.html')):
              h = open(f, encoding='utf-8', errors='replace').read().replace('\\/', '/').replace('\\"', '"').replace('&quot;', '"').replace('&#39;', "'")
              t = re.search(r'<title>(.*?)</title>', h, re.S); out.append('=== %s | %s' % (f, (t.group(1).strip() if t else '')[:100]))
              for c in sorted(set(re.findall(r'(?:Matte|Gloss|Satin)\s[A-Z][A-Za-z]+(?:\s[A-Za-z]+){0,3}(?:\s?/\s?(?:Matte|Gloss|Satin)?\s?[A-Z][A-Za-z]+(?:\s[A-Za-z]+){0,3})?', h))):
                  out.append('COLORE ' + c)
              for m in re.finditer(r'5346(?:74[2-9]|75[0-3])', h):
                  out.append('CTX %s | %s' % (m.group(0), re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', h[max(0, m.start()-300): m.end()+200]))[:500]))
              for i in sorted(set(re.findall(r'https?://[^"\' <>)]+(?:trek|Trek|Madone|madone)[^"\' <>)]*\.(?:jpg|jpeg|png|webp)', h))):
                  out.append('IMG ' + i)
              for i in sorted(set(re.findall(r'https?://media\.trekbikes\.com/image/upload/[^"\' <>)]+', h))):
                  out.append('TREKIMG ' + i)
          txt = '\n'.join(l for l in dict.fromkeys(out) if 'token' not in l.lower())
          open('probe/dealer.txt', 'w').write(txt); print('righe', txt.count('\n'))
          PY
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: dealer Madone SL 7" || echo "niente"
          git pull --rebase || true
          git push
