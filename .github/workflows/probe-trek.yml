name: probe-trek
on: push
permissions:
  contents: write
jobs:
  c4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: C4 e Orange Slice
        shell: bash
        run: |
          set +e
          mkdir -p probe/img2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sL -A "$UA" -H "Accept-Language: it-IT" -o /tmp/c4.html "https://www.cannondale.com/it-it/bikes/road/gravel/topstone-carbon/topstone-carbon-4-cues-1x-smu"
          { echo "bytes $(wc -c < /tmp/c4.html)"; grep -o '"Sku":"C1524GU[^}]\{0,400\}' /tmp/c4.html | grep -o '"Sku":"[^"]*"\|"ColorName":"[^"]*"\|"Size":"[^"]*"\|"Upc":"[0-9]*"' | paste - - - - | sort -u; grep -o 'https://embed.widencdn.net/img/dorelrl/[a-z0-9]*/[0-9]*px@1x/C26_C1524GU[^"?]*' /tmp/c4.html | sort -u; } > probe/c4.txt
          cat probe/c4.txt
          for u in $(grep -o 'https://embed.widencdn.net/img/dorelrl/[a-z0-9]*/[0-9]*px@1x/C26_C1524GU[^"?]*\.png' /tmp/c4.html | sort -u); do
            n=$(basename $u .png); big=$(echo $u | sed 's|/[0-9]*px@1x/|/2400px@1x/|; s|\.png$|.jpg|')
            curl -sfL -A "$UA" -o "probe/img2/$n.jpg" "$big?color=f8f8f8&q=90" && echo "ok $n"
          done
          while read u; do
            n=$(basename $u .png); big=$(echo $u | sed 's|/[0-9]*px@1x/|/2400px@1x/|; s|\.png$|.jpg|')
            [ -f "probe/img2/$n.jpg" ] || { curl -sfL -A "$UA" -o "probe/img2/$n.jpg" "$big?color=f8f8f8&q=90" && echo "ok $n"; }
          done < probe/urls2.txt
          find probe/img2 -type f -size -15k -delete; ls probe/img2
      - name: commit risultato
        run: |
          git config user.name "probe"; git config user.email "probe@local"
          git add -A; git commit -qm "probe: C4 e ORS" || echo "niente"; git fetch -q origin; git rebase origin/claude/install-ui-ux-pro-max-cq88gs || (git rebase --abort; git reset --soft origin/claude/install-ui-ux-pro-max-cq88gs; git commit -qm "probe: C4 e ORS"); git push -u origin HEAD:claude/install-ui-ux-pro-max-cq88gs
