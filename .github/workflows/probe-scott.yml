name: probe-scott
on: push
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scarica immagini zoom/raw dalle liste
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for d in premium dieci; do
            grep -E 't_assetformat(zoom|raw|opengraph)/' probe/$d/immagini.txt | sort -u | while read -r img; do
              fmt=$(echo "$img" | sed -E 's#.*t_assetformat([a-z]+)/.*#\1#')
              id=$(basename "$img"); id="${id%%\?*}"
              out="probe/$d/$fmt-$id"
              [ -f "$out" ] || curl -sSL -A "$UA" "$img" -o "$out" || true
            done
            find probe/$d -type f -size -2k -name '*-*' -delete
            ls -la probe/$d | head -60
          done
          du -sh probe
      - name: commit risultato
        run: |
          git config user.name "probe"
          git config user.email "probe@local"
          git add probe/
          git commit -m "probe: immagini Scott Fastlane" || echo "niente"
          git push
