name: probe-png
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch cannondale pngs
        run: |
          mkdir -p probe/png
          UA="Mozilla/5.0"
          curl -sL -A "$UA" -o probe/png/bbq.png "https://embed.widencdn.net/img/dorelrl/drn6zz5won/2000px@1x/C26_C6501GU_Moterra_1_EU_BBQ_PD.png" || true
          curl -sL -A "$UA" -o probe/png/tsk.png "https://embed.widencdn.net/img/dorelrl/s0fvbeiehj/2000px@1x/C26_C6501GU_Moterra_1_EU_TSK_PD.png" || true
          ls -la probe/png
      - name: commit results
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@local"
          git add probe/png
          git commit -m "probe: png moterra" || echo "nothing"
          git push
